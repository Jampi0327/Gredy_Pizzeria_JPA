version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql_pizzeria
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
      MYSQL_DATABASE: pizzeria_db
      MYSQL_USER: gredy_dev
      MYSQL_PASSWORD: devpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_pizzeria_data:/var/lib/mysql

volumes:
  mysql_pizzeria_data: